<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Origin Client Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Fonts -->
  <link href="https://fonts.cdnfonts.com/css/coolvetica" rel="stylesheet">

  <!-- CSS Styling -->
  <style>
    /* RESET + BASE */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Coolvetica', sans-serif;
    }

    body {
      background-color: #0a0a0a;
      color: #fff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* HEADER */
    header {
      background: #0d0d0d;
      padding: 20px;
      text-align: center;
      font-size: 2.5rem;
      font-weight: bold;
      letter-spacing: 2px;
      border-bottom: 1px solid #222;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    /* NAVIGATION */
    nav {
      display: flex;
      justify-content: center;
      gap: 15px;
      background: #0d0d0d;
      padding: 15px;
      border-bottom: 1px solid #222;
      position: sticky;
      top: 80px;
      z-index: 90;
    }

    nav button {
      background: #111;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s, transform 0.3s;
    }

    nav button:hover {
      background: #1c1c1c;
      transform: scale(1.05);
    }

    /* MAIN SECTION */
    section {
      padding: 50px 20px;
      max-width: 1300px;
      margin: auto;
    }

    .section-title {
      font-size: 2rem;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #333;
      padding-bottom: 10px;
    }

    .expand-button {
      background: none;
      border: none;
      color: #aaa;
      font-size: 2rem;
      cursor: pointer;
      transition: color 0.3s;
    }

    .expand-button:hover {
      color: #fff;
    }

    /* GRID */
    .store-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 25px;
      margin-top: 30px;
    }

    /* ITEM CARD */
    .item-card {
      background: #111;
      border: 1px solid #222;
      border-radius: 15px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .item-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 10px 20px rgba(255,255,255,0.1);
      border-color: #333;
    }

    .item-image-container {
      background: #1a1a1a;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .item-image-container img {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
    }

    .item-info {
      padding: 20px;
      text-align: center;
    }

    .item-name {
      font-size: 1.4rem;
      margin-bottom: 10px;
    }

    .item-price {
      color: #888;
      margin-bottom: 15px;
      font-size: 1rem;
    }

    .buy-button {
      background: transparent;
      border: 2px solid #fff;
      color: #fff;
      padding: 10px 18px;
      font-size: 1rem;
      border-radius: 8px;
      transition: background 0.3s, color 0.3s;
      cursor: pointer;
      width: 100%;
    }

    .buy-button:hover {
      background: #fff;
      color: #000;
    }

    /* FOOTER */
    footer {
      margin-top: auto;
      padding: 20px;
      background: #0d0d0d;
      text-align: center;
      font-size: 0.9rem;
      color: #555;
      border-top: 1px solid #222;
    }

    /* SINGLE ITEM + EXPANDED AREA */
    .expanded-area, .single-item-page {
      display: none;
      padding: 50px 20px;
      max-width: 1300px;
      margin: auto;
      animation: fadeIn 0.5s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .back-button {
      background: none;
      border: none;
      color: #aaa;
      font-size: 1rem;
      cursor: pointer;
      margin-bottom: 20px;
      transition: color 0.3s;
    }

    .back-button:hover {
      color: #fff;
    }

    /* MOBILE RESPONSIVE */
    @media (max-width: 768px) {
      header { font-size: 2rem; }
      nav button { font-size: 0.9rem; padding: 8px 16px; }
      .section-title { font-size: 1.7rem; }
      .item-name { font-size: 1.2rem; }
      .item-price { font-size: 0.9rem; }
      .buy-button { font-size: 0.9rem; }
    }
  </style>
</head>

<body>

<header>Origin Client Store</header>

<nav>
  <button onclick="scrollToSection('cloaks')">Cloaks</button>
  <button onclick="scrollToSection('crowns')">Crowns</button>
  <button onclick="scrollToSection('shields')">Shields</button>
  <button onclick="scrollToSection('bandanas')">Bandanas</button>
</nav>

<!-- STORE SECTIONS -->
<section id="cloaks" class="store-section">
  <div class="section-title">
    <span>Cloaks</span>
    <button class="expand-button" onclick="openExpanded('expanded-cloaks')">→</button>
  </div>
  <div class="store-grid">
    <!-- Item Example -->
    <div class="item-card">
      <div class="item-image-container">
        <img src="https://cdn.discordapp.com/attachments/1155423501205901312/1365994523540455494/file_2.gif" alt="Red Lightning Cloak">
      </div>
      <div class="item-info">
        <div class="item-name">Red Lightning Cloak</div>
        <div class="item-price">FREE</div>
        <button class="buy-button" onclick="openItem('red-lightning')">Get for Free</button>
      </div>
    </div>

    <!-- ADD MORE ITEMS HERE -->
  </div>
</section>

<!-- Example Other Sections (Crowns, Shields, Bandanas) similar -->

<!-- EXPANDED AREA -->
<div id="expanded-cloaks" class="expanded-area">
  <button class="back-button" onclick="goBack()">← Back</button>
  <h2>Cloaks (Expanded)</h2>
  <div class="store-grid">
    <!-- Same structure as above items -->
  </div>
</div>

<!-- SINGLE ITEM PAGE -->
<div id="red-lightning" class="single-item-page">
  <button class="back-button" onclick="goBack()">← Back</button>
  <div class="item-card">
    <div class="item-image-container">
      <img src="https://cdn.discordapp.com/attachments/1155423501205901312/1365994523540455494/file_2.gif" alt="Red Lightning Cloak">
    </div>
    <div class="item-info">
      <div class="item-name">Red Lightning Cloak</div>
      <a href="https://www.mediafire.com/file/ziajhvym7tky0rn/red+lightning.mcpack/file" download class="buy-button">Download</a>
    </div>
  </div>
</div>

<footer>
  © 2025 Origin Client. All rights reserved.
</footer>

<!-- SCRIPT -->
<script>
  function scrollToSection(id) {
    document.getElementById(id).scrollIntoView({ behavior: 'smooth' });
  }

  function openExpanded(id) {
    document.querySelectorAll('section, nav, footer, header').forEach(el => el.style.display = 'none');
    document.getElementById(id).style.display = 'block';
    window.scrollTo(0, 0);
  }

  function openItem(id) {
    document.querySelectorAll('section, nav, footer, header, .expanded-area, .single-item-page').forEach(el => el.style.display = 'none');
    document.getElementById(id).style.display = 'block';
    window.scrollTo(0, 0);
  }

  function goBack() {
    document.querySelectorAll('.expanded-area, .single-item-page').forEach(el => el.style.display = 'none');
    document.querySelectorAll('section, nav, footer, header').forEach(el => el.style.display = 'block');
    window.scrollTo(0, 0);
  }
</script>

</body>
</html>
