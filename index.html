<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cosmetic Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #121212;
      color: #fff;
    }
    header {
      padding: 20px;
      text-align: center;
      font-size: 2em;
      background: #1f1f1f;
    }
    .group-title {
      margin: 20px;
      font-size: 1.5em;
      border-bottom: 2px solid #555;
      padding-bottom: 5px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 20px;
      padding: 20px;
    }
    .card {
      background: #1f1f1f;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      text-align: center;
      transition: transform 0.2s;
    }
    .card:hover {
      transform: scale(1.05);
    }
    .card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
    }
    .card-name {
      padding: 10px;
      font-size: 1.1em;
    }
    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: #2c2c2c;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      max-width: 400px;
    }
    .modal-content img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 10px;
    }
    .modal-content h2 {
      margin: 15px 0 10px;
    }
    .download-btn {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 20px;
      background: #4caf50;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-size: 1em;
    }
    .close {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 2em;
      cursor: pointer;
    }
  </style>
</head>
<body>

<header>Cosmetic Store</header>

<!-- Cloaks Group -->
<div class="group-title">Cloaks</div>
<div class="grid" id="cloaks-grid">
  <!-- Cloaks cards here -->
</div>

<!-- Crowns Group -->
<div class="group-title">Crowns</div>
<div class="grid" id="crowns-grid">
  <!-- Crowns cards here -->
</div>

<!-- Horns Group -->
<div class="group-title">Horns</div>
<div class="grid" id="horns-grid">
  <!-- Horns cards here -->
</div>

<!-- Wings Group -->
<div class="group-title">Wings</div>
<div class="grid" id="wings-grid">
  <!-- Wings cards here -->
</div>

<!-- Bandanas Group -->
<div class="group-title">Bandanas</div>
<div class="grid" id="bandanas-grid">
  <!-- Bandanas cards here -->
</div>

<!-- Modal for detail view -->
<div class="modal" id="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <img id="modal-image" src="" alt="Cosmetic Image">
    <h2 id="modal-title"></h2>
    <a id="modal-download" href="#" class="download-btn" target="_blank">Download</a>
  </div>
</div>

<script>
  const cosmetics = [
    {
      group: "cloaks",
      name: "Fire Cape",
      icon: "https://example.com/firecape.png",
      download: "https://example.com/firecape.zip"
    },
    {
      group: "horns",
      name: "Devil Horns",
      icon: "https://example.com/devilhorns.png",
      download: "https://example.com/devilhorns.zip"
    },
    {
      group: "wings",
      name: "Angel Wings",
      icon: "https://example.com/angelwings.png",
      download: "https://example.com/angelwings.zip"
    },
    {
      group: "bandanas",
      name: "Red Bandana",
      icon: "https://example.com/redbandana.png",
      download: "https://example.com/redbandana.zip"
    },
    {
      group: "crowns",
      name: "Golden Crown",
      icon: "https://example.com/goldcrown.png",
      download: "https://example.com/goldcrown.zip"
    },
  ];

  const modal = document.getElementById("modal");
  const modalImage = document.getElementById("modal-image");
  const modalTitle = document.getElementById("modal-title");
  const modalDownload = document.getElementById("modal-download");

  function openModal(cosmetic) {
    modal.style.display = "flex";
    modalImage.src = cosmetic.icon;
    modalTitle.textContent = cosmetic.name;
    modalDownload.href = cosmetic.download;
  }

  function closeModal() {
    modal.style.display = "none";
  }

  cosmetics.forEach(cosmetic => {
    const grid = document.getElementById(cosmetic.group + "-grid");
    if (grid) {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <img src="${cosmetic.icon}" alt="${cosmetic.name}">
        <div class="card-name">${cosmetic.name}</div>
      `;
      card.onclick = () => openModal(cosmetic);
      grid.appendChild(card);
    }
  });
</script>

</body>
</html>
